spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/payment_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootStrap-server: kafka:29092
    producer:
      key-deserializer: org.apache.kafka.common.serialization.String@Deserializer
      value-deserializer: org.springframework.kafka.support.serializer.ksoonDeserializer
server:
  port: 8083

# razorPay configuration
razorpay:
  key-id: rzp_fskjks
  key-secret:
  webhook-secret:

management:
  endpoints:
    web:
      exposure:
        include: health,info
