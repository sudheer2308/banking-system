spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/account_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootStrap-server: kafka:29092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.String@Deserializer
      value-deserializer : org.springframework.kafka.support.serializer.ksoonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-deserializer: org.apache.kafka.common.serialization.String@Deserializer
      value-deserializer: org.springframework.kafka.support.serializer.ksoonDeserializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
