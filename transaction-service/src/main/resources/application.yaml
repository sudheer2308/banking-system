spring:
  application:
    name: transaction-service
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/transaction_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.String@Deserializer
      value-deserializer: org.springframework.kafka.support.serializer.ksoonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-deserializer: org.apache.kafka.common.serialization.String@Deserializer
      value-deserializer: org.springframework.kafka.support.serializer.ksoonDeserializer

server:
  port: 8082

account:
  service:
    url: http://account-service:8081

management:
  endpoints:
    web:
      exposure:
        include: health, info

